[package]
name = "aistudio-desktop-fresh"
version = "0.1.0"
description = "A fresh native desktop AI Studio workspace"
authors = ["AIStudio"]
edition = "2021"

[lib]
name = "aistudio_desktop_fresh_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"\nreqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
