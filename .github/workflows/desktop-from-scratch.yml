name: Desktop app from scratch
on:
  push:
    branches: [desktop/from-scratch]
  pull_request:
    branches: [desktop/from-scratch]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-from-scratch-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos-arm64:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        run: npm install
      - name: Type-check and build frontend
        run: npm run build
      - name: Generate temporary valid app icon for packaging
        run: |
          mkdir -p src-tauri/icons
          python3 - <<'PY'
          import struct, zlib
          w = h = 64
          rows = []
          for y in range(h):
              row = bytearray([0])
              for x in range(w):
                  # Minimal indigo tile with a white center mark; real branding can replace this.
                  if 18 <= x <= 45 and 18 <= y <= 45 and (abs(x-32) < 7 or abs(y-32) < 7):
                      row.extend((255, 255, 255, 255))
                  else:
                      row.extend((79, 70, 229, 255))
              rows.append(bytes(row))
          def chunk(kind, data):
              return struct.pack(">I", len(data)) + kind + data + struct.pack(">I", zlib.crc32(kind + data) & 0xffffffff)
          png = b"\x89PNG\r\n\x1a\n"
          png += chunk(b"IHDR", struct.pack(">IIBBBBB", w, h, 8, 6, 0, 0, 0))
          png += chunk(b"IDAT", zlib.compress(b"".join(rows)))
          png += chunk(b"IEND", b"")
          open("src-tauri/icons/icon.png", "wb").write(png)
          PY
      - name: Check Rust desktop backend
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: Build macOS DMG
        run: npm run tauri build
      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: AIStudio-Desktop-macOS-AppleSilicon
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 7
