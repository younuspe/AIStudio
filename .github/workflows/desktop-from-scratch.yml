name: Desktop app from scratch
on:
  push:
    branches: [desktop/from-scratch]
  pull_request:
    branches: [desktop/from-scratch]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-from-scratch-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos-arm64:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        run: npm install
      - name: Use the existing Supru Stud app icon
        run: |
          mkdir -p src-tauri/icons
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/younuspe/Stud/main/public/AppIcon.icns \
            --output src-tauri/icons/SupruStud-AppIcon.icns
          file src-tauri/icons/SupruStud-AppIcon.icns
          python3 -c 'from pathlib import Path; p=Path("src-tauri/icons/SupruStud-AppIcon.icns").read_bytes(); assert p.startswith(b"icns"), "Supru Stud app icon is not a valid ICNS file"; print("Verified existing Supru Stud ICNS app icon:", len(p), "bytes")'
      - name: Build macOS desktop app and DMG
        run: npm run tauri build
      - name: Upload single Apple Silicon DMG
        uses: actions/upload-artifact@v4
        with:
          name: AIStudio-Desktop-macOS-AppleSilicon
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 7
