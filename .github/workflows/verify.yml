name: AIStudio verification

on:
  push:
    branches:
      - rebuild/desktop-from-scratch
  pull_request:
    branches:
      - rebuild/desktop-from-scratch
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aistudio-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests, lint, and production build
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --package-lock=false

      - name: Run automated tests
        run: npm test

      - name: Check lint
        run: npm run lint

      - name: Build production web application
        run: npm run build
