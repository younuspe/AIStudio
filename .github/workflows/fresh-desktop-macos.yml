name: Fresh Desktop macOS Build

on:
  workflow_dispatch:
  push:
    paths:
      - "fresh-desktop/**"
      - ".github/workflows/fresh-desktop-macos.yml"

jobs:
  build-macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: fresh-desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fresh-desktop/package-lock.json
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm install
      - name: Build macOS app and DMG
        run: npm run build
