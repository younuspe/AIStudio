name: Fresh Desktop macOS Build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "fresh-desktop/**"
      - ".github/workflows/fresh-desktop-macos.yml"
  push:
    paths:
      - "fresh-desktop/**"
      - ".github/workflows/fresh-desktop-macos.yml"

jobs:
  build-macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: fresh-desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm install
      - name: Build macOS app and DMG
        run: npm run build
      - name: Upload macOS installers
        uses: actions/upload-artifact@v4
        with:
          name: AI-Studio-Desktop-macOS
          path: |
            fresh-desktop/src-tauri/target/release/bundle/dmg/*.dmg
            fresh-desktop/src-tauri/target/release/bundle/macos/*.app
          if-no-files-found: error
          retention-days: 7
