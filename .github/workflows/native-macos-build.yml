name: Native macOS desktop build

on:
  push:
    branches:
      - desktop-productization
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-macos-build
  cancel-in-progress: false

jobs:
  build-macos:
    name: Build standalone macOS app
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Check out the selected branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select Swift toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Build and package Universal 2 app
        run: bash scripts/build-macos-app.sh

      - name: Validate app bundle metadata and executable
        run: |
          APP_BUNDLE="dist/Supru App Builder.app"
          plutil -lint "$APP_BUNDLE/Contents/Info.plist"
          test -x "$APP_BUNDLE/Contents/MacOS/AIStudio"
          file "$APP_BUNDLE/Contents/MacOS/AIStudio"
          lipo "$APP_BUNDLE/Contents/MacOS/AIStudio" -verify_arch arm64 x86_64
          test -s "$APP_BUNDLE/Contents/Resources/AppIcon.icns"
          codesign --verify --deep --strict --verbose=2 "$APP_BUNDLE"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP_BUNDLE/Contents/Info.plist" | grep -Fx 'Supru App Builder'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_BUNDLE/Contents/Info.plist" | grep -Fx 'com.supru.appbuilder'

      - name: Smoke-test native app launch
        run: |
          set -euo pipefail
          APP_EXEC="$GITHUB_WORKSPACE/dist/Supru App Builder.app/Contents/MacOS/AIStudio"
          LOG_FILE="$RUNNER_TEMP/supru-app-builder-launch.log"
          "$APP_EXEC" > "$LOG_FILE" 2>&1 &
          APP_PID=$!
          cleanup() {
            if kill -0 "$APP_PID" 2>/dev/null; then
              kill -TERM "$APP_PID" 2>/dev/null || true
              sleep 1
              kill -KILL "$APP_PID" 2>/dev/null || true
            fi
            wait "$APP_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in {1..8}; do
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              set +e
              wait "$APP_PID"
              APP_STATUS=$?
              set -e
              cat "$LOG_FILE"
              echo "Supru App Builder exited during its startup smoke test (exit $APP_STATUS)." >&2
              exit 1
            fi
            sleep 1
          done
          echo "Supru App Builder native process remained alive for the 8-second startup smoke test."

      - name: Create downloadable app archive
        run: |
          ditto -c -k --sequesterRsrc --keepParent "dist/Supru App Builder.app" dist/Supru-App-Builder-macos.zip
          shasum -a 256 dist/Supru-App-Builder-macos.zip > dist/Supru-App-Builder-macos.zip.sha256

      - name: Upload standalone app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Supru-App-Builder-macOS-ad-hoc-signed-not-notarized
          path: |
            dist/Supru-App-Builder-macos.zip
            dist/Supru-App-Builder-macos.zip.sha256
          if-no-files-found: error
          retention-days: 14
