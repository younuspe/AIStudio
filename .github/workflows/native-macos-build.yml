name: Native macOS desktop build

on:
  push:
    branches:
      - desktop-productization
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-macos-build
  cancel-in-progress: false

jobs:
  build-macos:
    name: Build standalone macOS app
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Check out the selected branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select Swift toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Build and package Universal 2 app
        run: bash scripts/build-macos-app.sh

      - name: Validate app bundle metadata and executable
        run: |
          plutil -lint dist/AIStudio.app/Contents/Info.plist
          test -x dist/AIStudio.app/Contents/MacOS/AIStudio
          file dist/AIStudio.app/Contents/MacOS/AIStudio
          lipo dist/AIStudio.app/Contents/MacOS/AIStudio -verify_arch arm64 x86_64

      - name: Smoke-test native app launch
        run: |
          set -euo pipefail
          APP_EXEC="$GITHUB_WORKSPACE/dist/AIStudio.app/Contents/MacOS/AIStudio"
          LOG_FILE="$RUNNER_TEMP/aistudio-launch.log"
          "$APP_EXEC" > "$LOG_FILE" 2>&1 &
          APP_PID=$!
          cleanup() {
            if kill -0 "$APP_PID" 2>/dev/null; then
              kill -TERM "$APP_PID" 2>/dev/null || true
              sleep 1
              kill -KILL "$APP_PID" 2>/dev/null || true
            fi
            wait "$APP_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in {1..8}; do
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              set +e
              wait "$APP_PID"
              APP_STATUS=$?
              set -e
              cat "$LOG_FILE"
              echo "AIStudio exited during its startup smoke test (exit $APP_STATUS)." >&2
              exit 1
            fi
            sleep 1
          done
          echo "AIStudio native process remained alive for the 8-second startup smoke test."

      - name: Create downloadable app archive
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/AIStudio.app dist/AIStudio-macos.zip
          shasum -a 256 dist/AIStudio-macos.zip > dist/AIStudio-macos.zip.sha256

      - name: Upload standalone app artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIStudio-macOS-unsigned
          path: |
            dist/AIStudio-macos.zip
            dist/AIStudio-macos.zip.sha256
          if-no-files-found: error
          retention-days: 14
